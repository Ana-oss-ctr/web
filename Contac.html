       <input class="button" type="submit" value="Enviar" onclick="valida_envia()">

    <div id="mensaje-respuesta" style="margin-top: 20px; color: green;"></div>

  <!-- Bootstrap JS -->

  <!-- Script para manejar el envío AJAX  --> 
  <script>
function valida_envia() {
  const nombreInput = document.querySelector('input[name="nombre"]');
  const telefonoInput = document.querySelector('input[name="telefono"]');

  const nombre = nombreInput.value.trim();
  const telefono = telefonoInput.value.trim();

  const numeroRegex = /^[0-9]+$/;
  const textoRegex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;

  // Validar campo vacío para nombre
  if (!nombre) {
    alert("Por favor, escribe tu nombre.");
    nombreInput.focus();
    return false;
  }

  // Validar que el nombre solo tenga letras
  if (!textoRegex.test(nombre)) {
    alert("El nombre debe contener solo letras.");
    nombreInput.focus();
    return false;
  }

  // Validar campo vacío para teléfono
  if (!telefono) {
    alert("Por favor, ingresa tu número de teléfono.");
    telefonoInput.focus();
    return false;
  }

  // Validar que el teléfono solo tenga números
  if (!numeroRegex.test(telefono)) {
    alert("El teléfono debe contener solo números.");
    telefonoInput.focus();
    return false;
  }

  return true; // Si pasa todas las validaciones, permite el envío
}
// Integrar con tu listener:
document.getElementById("formulario-opinion").addEventListener("submit", function(e) {
  e.preventDefault();
  if (!valida_envia()) return; // Detiene el envío si no pasa la validación

  const form = e.target;
  const datos = new FormData(form);

  fetch("Php/submit.php", {
    method: "POST",
    body: datos
  })
  .then(response => response.text())
  .then(data => {
    document.getElementById("mensaje-respuesta").innerHTML = data;
    form.reset();
  })
  .catch(error => {
    document.getElementById("mensaje-respuesta").innerHTML = "Ocurrió un error.";
    console.error("Error:", error);
  });
});
</script>
